name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0-alpha.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as GitHub pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  XGENEXT2FS_VERSION: v1.5.6
  XGENEXT2FS_SHA256_AMD64: 996e4e68a638b5dc5967d3410f92ecb8d2f41e32218bbe0f8b4c4474d7eebc59
  XGENEXT2FS_SHA256_ARM64: e5aca81164b762bbe5447bacef41e4fa9e357fd9c8f44e519c5206227d43144d
  CARTESI_MACHINE_VERSION: v0.20.0-test2
  CARTESI_MACHINE_SHA256_AMD64: 39bbfc96a6cc6606307294b719df65f4f2725e8d200d062bcbd8c22355b99b56
  CARTESI_MACHINE_SHA256_ARM64: 787d823756000cdecd72da8a3494b4c08613087379035959e561bbaef7a220ba

jobs:
  build-sequencer:
    name: Build sequencer (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            lua5.4 \
            liblua5.4-dev \
            libslirp-dev \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (release)
        run: cross build -p sequencer --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist

          mkdir -p "package/sequencer-${TAG}-linux-${ARCH}"
          cp "target/${TARGET}/release/sequencer" "package/sequencer-${TAG}-linux-${ARCH}/sequencer"

          cat > "package/sequencer-${TAG}-linux-${ARCH}/RUNNING.md" <<'EOF'
          ## Running

          Required environment variables:

          - `SEQ_ETH_RPC_URL`
          - `SEQ_CHAIN_ID`
          - `SEQ_APP_ADDRESS`
          - `SEQ_BATCH_SUBMITTER_PRIVATE_KEY` (or `SEQ_BATCH_SUBMITTER_PRIVATE_KEY_FILE`)

          Example:

          ```bash
          SEQ_ETH_RPC_URL=http://127.0.0.1:8545 \
          SEQ_CHAIN_ID=31337 \
          SEQ_APP_ADDRESS=0x1111111111111111111111111111111111111111 \
          SEQ_BATCH_SUBMITTER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
          ./sequencer
          ```
          EOF

          tar -C package -czf "dist/sequencer-${TAG}-linux-${ARCH}.tar.gz" "sequencer-${TAG}-linux-${ARCH}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: sequencer-linux-${{ matrix.arch }}
          path: dist/sequencer-*.tar.gz

  build-canonical-machine-image:
    name: Build canonical machine images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup guest toolchain
        uses: ./.github/actions/setup-guest-toolchain
        with:
          xgenext2fs-version: ${{ env.XGENEXT2FS_VERSION }}
          xgenext2fs-sha256-amd64: ${{ env.XGENEXT2FS_SHA256_AMD64 }}
          xgenext2fs-sha256-arm64: ${{ env.XGENEXT2FS_SHA256_ARM64 }}
          cartesi-machine-version: ${{ env.CARTESI_MACHINE_VERSION }}
          cartesi-machine-sha256-amd64: ${{ env.CARTESI_MACHINE_SHA256_AMD64 }}
          cartesi-machine-sha256-arm64: ${{ env.CARTESI_MACHINE_SHA256_ARM64 }}

      - name: Download canonical app deps
        run: just -f examples/canonical-app/justfile download-deps

      - name: Build machine image (devnet)
        run: just canonical-build-machine-image

      - name: Build machine image (sepolia)
        run: just canonical-build-machine-image-sepolia

      - name: Package machine image stores
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -d examples/canonical-app/out/canonical-machine-image
          test -d examples/canonical-app/out/canonical-machine-image-sepolia
          mkdir -p dist
          tar -C examples/canonical-app/out -czf "dist/canonical-machine-image-devnet-${TAG}.tar.gz" canonical-machine-image
          tar -C examples/canonical-app/out -czf "dist/canonical-machine-image-sepolia-${TAG}.tar.gz" canonical-machine-image-sepolia

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: canonical-machine-images
          path: dist/canonical-machine-image-*.tar.gz

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-sequencer
      - build-canonical-machine-image
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f -name '*.tar.gz' -exec cp -v '{}' out/ \;

      - name: Generate checksums
        working-directory: out
        run: |
          set -euo pipefail
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ inputs.prerelease || true }}
          fail_on_unmatched_files: true
          files: |
            out/*.tar.gz
            out/SHA256SUMS
