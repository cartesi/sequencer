# Release workflow: git tag v* builds wallet-sequencer tarballs, CM images, and pushes
# watchdog OCI images to ghcr.io + docker.io (requires DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN org or repo secrets, same as cartesi/cli).
# Release builds start cold: no step restores a cache that other refs wrote.
# Before tagging, run `bash scripts/verify-toolchain-pins.sh --upstream`, fix
# what it flags, then run `bash scripts/verify-action-pins.sh --upstream` and
# bump, or knowingly keep, each pin it flags. An action only this workflow uses gets
# no CI run, so a bumped one first runs at the tag; if it fails, fix it on main
# and dispatch this workflow for the same tag.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (e.g. v0.1.0-alpha.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as GitHub pre-release"
        required: true
        default: true
        type: boolean

# Jobs that write declare it; everything else only reads.
permissions:
  contents: read

# A tag push and a dispatch for the same tag run one after the other, never
# interleaving builds, image pushes or release uploads.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Builds are not incremental, and cargo output stays coloured in the logs.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build-wallet-sequencer:
    name: Build wallet-sequencer (${{ matrix.arch }})
    # Each arch builds natively on its own runner, the way CI builds: the
    # sequencer links the pinned emulator's static archive, which the
    # cartesi-machine .deb ships only for the host's arch and which links only
    # against GCC 14's libstdc++.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      # A push builds the pushed commit; a dispatch builds the named tag, fully
      # qualified so a branch or SHA input cannot stand in and a missing tag fails.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Load toolchain pins
        uses: ./.github/actions/load-toolchain-pins

      # libclang for the emulator bindings' bindgen; cmake for aws-lc-sys; the
      # .deb's libcartesi.a references libslirp.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            build-essential \
            cmake \
            libclang-dev \
            libslirp-dev \
            pkg-config

      # Exports LIBCARTESI_PATH / INCLUDECARTESI_PATH; the binary links the
      # archive statically, so the release host needs no emulator install.
      - name: Install cartesi-machine
        uses: ./.github/actions/install-cartesi-machine
        with:
          version: ${{ env.CARTESI_MACHINE_VERSION }}
          sha256-amd64: ${{ env.CARTESI_MACHINE_SHA256_AMD64 }}
          sha256-arm64: ${{ env.CARTESI_MACHINE_SHA256_ARM64 }}

      # rust-toolchain.toml is the only Rust pin.
      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      # `sequencer` is a library crate; the runnable reference binary is the
      # `wallet-sequencer` example app (sequencer lib + the placeholder wallet).
      - name: Build (release)
        run: cargo build -p wallet-sequencer --release --locked --target ${{ matrix.target }}

      # The runner has libcartesi.so installed, so loading proves little on its
      # own: the binary must not name it, or release hosts would need the .deb.
      - name: Check the binary's shared libraries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/wallet-sequencer"
          needed="$(readelf -d "${bin}" | grep NEEDED)"
          echo "${needed}"
          if grep -q libcartesi <<< "${needed}"; then
            echo "::error::wallet-sequencer links libcartesi dynamically"
            exit 1
          fi
          "${bin}" setup --help > /dev/null

      - name: Package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist

          mkdir -p "package/wallet-sequencer-${TAG}-linux-${ARCH}"
          cp "target/${TARGET}/release/wallet-sequencer" "package/wallet-sequencer-${TAG}-linux-${ARCH}/wallet-sequencer"
          bash scripts/generate-release-manifest.sh \
            --tag "${TAG}" \
            --git-sha "$(git rev-parse HEAD)" \
            --output "package/wallet-sequencer-${TAG}-linux-${ARCH}/RELEASE.json"

          cat > "package/wallet-sequencer-${TAG}-linux-${ARCH}/RUNNING.md" <<'EOF'
          ## Running

          `wallet-sequencer` is the reference sequencer: the sequencer library with the
          placeholder wallet. A data directory is set up once with `setup`, then served
          with `run`.

          ### Host

          The binary links the Cartesi Machine emulator statically (the version is
          `toolchain.cartesi_machine` in RELEASE.json), so the emulator need not be
          installed. The binary is built on Ubuntu 24.04 and the emulator's archive
          with GCC 14, so the host needs that glibc and GCC 14's libstdc++: Ubuntu
          24.04, Debian 13, or a newer release. At run time it loads libslirp, libgomp
          and libstdc++, and its
          L1 client reads the system's CA certificates:

          ```bash
          apt-get install ca-certificates libgomp1 libslirp0 libstdc++6
          ```

          ### setup

          `setup` starts an era in an empty data directory. It pins the deployment
          identity, flushes the batch submitter's wallet with its key, which pins the
          stop block, syncs L1, rebuilds the history from its base through the stop
          block, and publishes the era.

          - The base is genesis by default. `--base <MACHINE_DIR>` starts from a stored
            canonical machine of the deployment's template, stopped between inputs and
            stored by the emulator version this binary links.
          - `--dry-run` prints the base's counts, the submitter's activity past it and
            the rebuild's size, then exits. It needs no key and never touches the data
            directory.
          - It needs `CARTESI_SEQUENCER_BLOCKCHAIN_HTTP_ENDPOINT`,
            `CARTESI_SEQUENCER_BLOCKCHAIN_ID`, `CARTESI_SEQUENCER_APP_ADDRESS`,
            `CARTESI_SEQUENCER_BATCH_SUBMITTER_ADDRESS` and, unless `--dry-run`, the
            submitter's key, `CARTESI_SEQUENCER_AUTH_PRIVATE_KEY` or
            `CARTESI_SEQUENCER_AUTH_PRIVATE_KEY_FILE` (whose first line is the key),
            which must sign for that address. Chains other than Ethereum mainnet and
            Sepolia also need a fee-oracle source, such as
            `CARTESI_SEQUENCER_FEE_ORACLE_FIXED_LOG_GAS_PRICE`.

          Setup refuses a data directory that holds anything (exit 30), so it runs once
          per directory; never run it on every boot. Its retryable L1 checks run before
          it writes anything, so retry an exit 20 in the same directory; if the retry
          is refused because the directory is not empty, or setup failed any other
          way, discard the directory and run setup again. Exit 40 means the old
          instance's submitter landed an input past the stop block or still has a
          transaction pending: stop the old instance, discard this data directory,
          run setup again.

          ### run

          `run` serves a directory that setup completed, reading the identity from it.
          It needs `CARTESI_SEQUENCER_BLOCKCHAIN_HTTP_ENDPOINT` and the same key.

          ### Example

          ```bash
          export CARTESI_SEQUENCER_BLOCKCHAIN_HTTP_ENDPOINT=http://127.0.0.1:8545
          export CARTESI_SEQUENCER_AUTH_PRIVATE_KEY_FILE=/run/secrets/submitter-key
          export CARTESI_SEQUENCER_DATA_DIR=/var/lib/sequencer

          CARTESI_SEQUENCER_BLOCKCHAIN_ID=31337 \
          CARTESI_SEQUENCER_APP_ADDRESS=0x1111111111111111111111111111111111111111 \
          CARTESI_SEQUENCER_BATCH_SUBMITTER_ADDRESS=0xa0Ee7A142d267C1f36714E4a8F75612F20a79720 \
          CARTESI_SEQUENCER_FEE_ORACLE_FIXED_LOG_GAS_PRICE=0 \
          ./wallet-sequencer setup            # or: setup --base ./canonical-machine

          ./wallet-sequencer run
          ```

          Each subcommand's `--help` lists every option and its environment variable.
          EOF

          tar -C package -czf "dist/wallet-sequencer-${TAG}-linux-${ARCH}.tar.gz" "wallet-sequencer-${TAG}-linux-${ARCH}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wallet-sequencer-linux-${{ matrix.arch }}
          path: dist/wallet-sequencer-*.tar.gz

  build-canonical-machine-image:
    name: Build canonical machine images
    runs-on: ubuntu-24.04
    steps:
      # A push builds the pushed commit; a dispatch builds the named tag, fully
      # qualified so a branch or SHA input cannot stand in and a missing tag fails.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Load toolchain pins
        uses: ./.github/actions/load-toolchain-pins

      - name: Setup guest toolchain
        uses: ./.github/actions/setup-guest-toolchain
        with:
          cache: "false"

      - name: Download canonical app deps
        run: just canonical download-deps

      - name: Build machine image (devnet)
        run: just canonical-build-machine-image

      - name: Build machine image (sepolia)
        run: just canonical-build-machine-image-sepolia

      - name: Package machine image stores
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -d examples/canonical-app/out/canonical-machine-image
          test -d examples/canonical-app/out/canonical-machine-image-sepolia
          mkdir -p dist
          tar -C examples/canonical-app/out -czf "dist/canonical-machine-image-devnet-${TAG}.tar.gz" canonical-machine-image
          tar -C examples/canonical-app/out -czf "dist/canonical-machine-image-sepolia-${TAG}.tar.gz" canonical-machine-image-sepolia

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-machine-images
          path: dist/canonical-machine-image-*.tar.gz

  build-watchdog-image:
    name: Build and push watchdog image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # ghcr.io push
    steps:
      # A push builds the pushed commit; a dispatch builds the named tag, fully
      # qualified so a branch or SHA input cannot stand in and a missing tag fails.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Load toolchain pins
        uses: ./.github/actions/load-toolchain-pins

      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured (org or repo secrets; same as cartesi/cli)"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false

      # The builder records the Actions context (run, ref, commit, actor, event
      # payload) in the image's provenance. It stays on: everything in it is
      # already public for this public repository, and verifiers use it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push watchdog image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Also skips the build-record artifact, which broke publish's download.
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: watchdog/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cartesi/sequencer-watchdog:${{ inputs.tag || github.ref_name }}
            docker.io/cartesi/sequencer-watchdog:${{ inputs.tag || github.ref_name }}
          build-args: |
            RELEASE_TAG=${{ inputs.tag || github.ref_name }}
            GIT_COMMIT=${{ steps.commit.outputs.sha }}
            CARTESI_MACHINE_VERSION=${{ env.CARTESI_MACHINE_VERSION }}
            CARTESI_MACHINE_DEB_SHA256_AMD64=${{ env.CARTESI_MACHINE_SHA256_AMD64 }}
            CARTESI_MACHINE_DEB_SHA256_ARM64=${{ env.CARTESI_MACHINE_SHA256_ARM64 }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - build-wallet-sequencer
      - build-canonical-machine-image
      - build-watchdog-image
    permissions:
      contents: write # create the release and upload its assets
    steps:
      # A push builds the pushed commit; a dispatch builds the named tag, fully
      # qualified so a branch or SHA input cannot stand in and a missing tag fails.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Load toolchain pins
        uses: ./.github/actions/load-toolchain-pins

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "{wallet-sequencer-linux-*,canonical-machine-images}"
          # The default since v8: an artifact whose bytes changed after upload, in
          # storage or transit, fails publish.
          digest-mismatch: error

      - name: Flatten artifacts
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f -name '*.tar.gz' -exec cp -v '{}' out/ \;
          bash scripts/generate-release-manifest.sh \
            --tag "${TAG}" \
            --git-sha "$(git rev-parse HEAD)" \
            --output "out/release-manifest-${TAG}.json"

      - name: Generate checksums
        working-directory: out
        run: |
          set -euo pipefail
          sha256sum *.tar.gz *.json > SHA256SUMS

      # gh ships with the runner image, so no third-party code holds contents:write.
      # A tag push creates the release. A dispatch rebuild finds it, published or
      # draft, replaces its same-name assets, and publishes it if it was a draft.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_TELEMETRY: "false"
          TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || (github.event_name == 'push' && contains(github.ref_name, '-')) }}
        run: |
          set -euo pipefail
          gh --version
          # An asset glob that matches nothing fails here, before any API call.
          ls -l out/*.tar.gz out/*.json out/SHA256SUMS
          assets=(out/*.tar.gz out/*.json out/SHA256SUMS)
          # A view that fails for another reason also falls through to create, whose
          # check refuses to duplicate a published release.
          if gh release view --json url -- "${TAG}" > /dev/null; then
            gh release upload --clobber -- "${TAG}" "${assets[@]}"
            gh release edit --prerelease="${PRERELEASE}" --draft=false -- "${TAG}"
          else
            # --verify-tag refuses to create a missing tag; gh uploads to a draft
            # and publishes it last, deleting the draft if an upload fails.
            gh release create --verify-tag --title "${TAG}" --notes "" \
              --prerelease="${PRERELEASE}" -- "${TAG}" "${assets[@]}"
          fi
