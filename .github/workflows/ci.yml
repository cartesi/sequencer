name: CI

# Pull requests, plus pushes to main and release tags; a branch is checked
# through its PR, so it does not also run on push.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A new push to a PR cancels that PR's older run. Every other run is its own
# group, so runs on main and tags are never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Builds are not incremental, and cargo output stays coloured in the logs.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Load toolchain pins
        uses: ./.github/actions/load-toolchain-pins

      - name: Verify toolchain pin alignment
        run: bash scripts/verify-toolchain-pins.sh

      - name: Verify action pins
        run: bash scripts/verify-action-pins.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            faketime \
            libclang-dev \
            libfaketime \
            lua5.4 \
            liblua5.4-dev \
            lua-check \
            libcurl4-openssl-dev \
            libslirp-dev \
            shellcheck

      - name: Shell lint
        run: shellcheck scripts/*.sh watchdog/sequencer-watchdog watchdog/test-guest/nvram.sh

      # canonical-test links the emulator through testsi's cartesi-machine
      # bindings, so the workspace build needs the pinned CM .deb and the
      # LIBCARTESI_PATH / INCLUDECARTESI_PATH this action exports.
      - name: Install cartesi-machine
        uses: ./.github/actions/install-cartesi-machine
        with:
          version: ${{ env.CARTESI_MACHINE_VERSION }}
          sha256-amd64: ${{ env.CARTESI_MACHINE_SHA256_AMD64 }}
          sha256-arm64: ${{ env.CARTESI_MACHINE_SHA256_ARM64 }}

      # rust-toolchain.toml is the only Rust pin; it lists rustfmt and clippy.
      - name: Install Rust toolchain
        run: rustup set profile minimal && rustup toolchain install

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Watchdog Lua lint
        run: cd watchdog && luacheck --no-color *.lua tests/*.lua tests/fixtures/*.lua

      - name: Watchdog Lua unit tests
        run: |
          bash scripts/watchdog-lua-deps.sh
          lua5.4 watchdog/tests/run.lua

      - name: Test
        timeout-minutes: 15
        run: cargo test --workspace --all-targets --all-features --locked

      - name: C application archive and downstream consumer
        run: bash scripts/ci-c-application-smoke.sh

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Load toolchain pins
        uses: ./.github/actions/load-toolchain-pins

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Lint OpenAPI definition
        run: npx --yes "@redocly/cli@${REDOCLY_CLI_VERSION}" lint openapi.yaml

  # Policy in deny.toml: crate sources block; advisories report without
  # failing, since the RustSec database changes under a fixed Cargo.lock.
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Load toolchain pins
        uses: ./.github/actions/load-toolchain-pins

      - name: Install Rust toolchain
        run: rustup set profile minimal && rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Crate sources
        run: cargo deny --locked check sources

      - name: Advisories (report only)
        continue-on-error: true
        run: cargo deny --locked check advisories

  rollups-e2e:
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Load toolchain pins
        uses: ./.github/actions/load-toolchain-pins

      - name: Setup guest toolchain
        uses: ./.github/actions/setup-guest-toolchain
        with:
          install-foundry: "true"

      # setup-guest-toolchain already ran apt-get update.
      - name: Install native test dependencies
        run: sudo apt-get install -y faketime libfaketime libclang-dev libcurl4-openssl-dev build-essential pkg-config

      - name: Download canonical app deps
        run: just canonical download-deps

      # Builds the devnet machine image, which the e2e recipe's
      # ensure-machine-image then reuses, so CI builds it once.
      - name: Run guest tests
        run: just canonical-test-guest

      - name: Run rollups E2E tests (Rust and C hosts)
        run: just test-rollups-e2e

      # Runs after the e2e step so the canonical images already exist. Builds the
      # watchdog test guest and checks the executor against the reference CLI.
      - name: Watchdog Lua CM e2e
        run: just test-watchdog-e2e

      - name: Upload E2E failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rollups-e2e-logs-${{ github.run_attempt }}
          path: tests/e2e/results/*.log
          retention-days: 7
          if-no-files-found: ignore

  watchdog-docker:
    name: Watchdog Docker image smoke
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Load toolchain pins
        uses: ./.github/actions/load-toolchain-pins

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and smoke-test watchdog image
        run: bash scripts/ci-watchdog-docker-smoke.sh
