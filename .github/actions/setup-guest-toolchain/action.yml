name: "Setup guest toolchain"
description: "Install system deps, QEMU/Buildx and Rust (rust-toolchain.toml), plus xgenext2fs, cartesi-machine, just and cross at the toolchain-pins.env versions (run ./.github/actions/load-toolchain-pins first)."

inputs:
  install-foundry:
    description: "Whether to install Foundry (for anvil)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Require toolchain pins
      shell: bash
      run: ': "${CARTESI_MACHINE_VERSION:?run ./.github/actions/load-toolchain-pins first}"'

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          lua5.4 \
          liblua5.4-dev \
          libslirp-dev \
          ca-certificates \
          wget \
          xz-utils

    - name: Install xgenext2fs
      shell: bash
      run: |
        set -euo pipefail
        ARCH="$(dpkg --print-architecture)"
        VERSION="${XGENEXT2FS_VERSION}"

        case "${ARCH}" in
          amd64)
            ASSET_NAME="xgenext2fs_amd64.deb"
            EXPECTED_SHA="${XGENEXT2FS_SHA256_AMD64}"
            ;;
          arm64)
            ASSET_NAME="xgenext2fs_arm64.deb"
            EXPECTED_SHA="${XGENEXT2FS_SHA256_ARM64}"
            ;;
          *)
            echo "unsupported arch for xgenext2fs: ${ARCH}" >&2
            exit 1
            ;;
        esac

        ASSET_URL="https://github.com/cartesi/genext2fs/releases/download/${VERSION}/${ASSET_NAME}"
        wget -O /tmp/xgenext2fs.deb "${ASSET_URL}"
        echo "${EXPECTED_SHA}  /tmp/xgenext2fs.deb" | sha256sum --check
        sudo apt-get install -y /tmp/xgenext2fs.deb

    - name: Install cartesi-machine
      uses: ./.github/actions/install-cartesi-machine
      with:
        version: ${{ env.CARTESI_MACHINE_VERSION }}
        sha256-amd64: ${{ env.CARTESI_MACHINE_SHA256_AMD64 }}
        sha256-arm64: ${{ env.CARTESI_MACHINE_SHA256_ARM64 }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # rust-toolchain.toml is the only Rust pin. rustup resolves it from the
    # working directory, so the cross guest build gets the same toolchain.
    - name: Install Rust toolchain
      shell: bash
      run: rustup set profile minimal && rustup toolchain install

    - name: Cache Rust artifacts
      uses: Swatinem/rust-cache@v2

    - name: Install Foundry
      if: inputs.install-foundry == 'true'
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: ${{ env.FOUNDRY_VERSION }}

    - name: Install just
      uses: taiki-e/install-action@v2
      with:
        tool: just

    - name: Install cross
      uses: taiki-e/install-action@v2
      with:
        tool: cross
