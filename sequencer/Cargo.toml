[package]
name = "sequencer"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true

[dependencies]
sequencer-core = { path = "../sequencer-core" }
axum = { version = "0.8.8", features = ["ws"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
tower-http = { version = "0.6.8", features = ["trace", "cors"] }
rusqlite = { workspace = true }
rusqlite_migration = "2.6.0"
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
alloy = { workspace = true, features = ["contract", "network", "reqwest", "rpc-types", "sol-types", "json-rpc", "signer-local", "signers"] }
alloy-network-primitives = "1.8"
alloy-transport = "1.8"
url = "2.5"
thiserror = { workspace = true }
ssz = { workspace = true }
ssz_derive = { workspace = true }
clap = { workspace = true, features = ["env"] }
cartesi-rollups-contracts = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
app-core = { path = "../examples/app-core" }
# Anvil bindings are test-only: production builds must not carry the
# node-spawning surface.
alloy = { workspace = true, features = ["node-bindings"] }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
tokio-tungstenite = { workspace = true }
k256 = { workspace = true }
tempfile = { workspace = true }
sequencer-rust-client = { path = "../sdk/rust-client" }
# Used for `TcpProxy` in inline tests that need to simulate provider disconnect
# (e.g., flusher survives extended outage). The sequencer crate doesn't depend
# on `rollups-harness` in production; only the test profile pulls it in.
rollups-harness = { path = "../tests/harness" }
