[package]
name = "rollups-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true

[dependencies]
app-core = { path = "../../examples/app-core" }
alloy = { version = "1.0", features = ["contract", "network", "provider-anvil-api", "reqwest", "rpc-types", "signer-local"] }
alloy-primitives = { version = "1.4.1", features = ["k256"] }
alloy-sol-types = "1.4.1"
cartesi-rollups-contracts = "=2.2.0"
futures-util = "0.3"
k256 = "0.13.4"
sequencer-core = { path = "../../sequencer-core" }
sequencer-rust-client = { path = "../../sdk/rust-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssz = { package = "ethereum_ssz", version = "0.10" }
tokio = { version = "1.35", features = ["net", "io-util", "process", "time"] }
tempfile = "3"
tokio-tungstenite = "0.28"
