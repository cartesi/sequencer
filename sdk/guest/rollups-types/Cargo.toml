[package]
name = "rollups-types"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
description = "Cartesi Rollups ABI types (inputs, outputs, portal deposits) shared by guest and host"
publish = false

[dependencies]
alloy-sol-types = "1"
alloy-primitives = "1"

[features]
# Test-only encoders (`Erc20Deposit::encode`) for other crates' tests. Only
# dev-dependencies and test binaries enable it; the guest never does.
test-support = []
