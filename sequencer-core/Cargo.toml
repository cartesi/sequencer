[package]
name = "sequencer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true

[dependencies]
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
ssz = { workspace = true }
ssz_derive = { workspace = true }
k256 = { workspace = true, optional = true }

[features]
# Test-only signing helpers (src/test_support.rs) for other crates' tests.
# Only test crates enable it; the guest build never does.
test-support = ["dep:k256"]

[dev-dependencies]
# Tests sign EIP-712 user-ops through crate::test_support.
k256 = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
ruint = "1.17"
